deployments:
  - name: etl_filters_deployment
    entrypoint: etl_prefect.py:etl_flow
    work_pool:
      name: "default-agent-pool"
    env:
      GIT_TOKEN: "{{ prefect.blocks.system.Secret('gittoken').get() }}"
    parameters:
      input_file: "input.csv"
    pull:
      - prefect.deployments.steps.git_clone:
          repository: "https://$GIT_TOKEN@github.com/vicoftech/prefect_etl.git"
          branch: "dev"


