deployments:
  - name: etl_filters_deployment
    entrypoint: etl_prefect.py:etl_flow
    work_pool:
      name: "default-agent-pool"
    infrastructure:
      type: "docker"
      image: "python:3.11-slim"
      env:
        # Token de GitHub como variable de entorno
        - GIT_TOKEN=${GIT_TOKEN}
        - PIP_NO_CACHE_DIR=1
      build:
        commands:
          # Instalar git y pip
          - apt-get update && apt-get install -y git && apt-get clean
          # Clonar repo privado usando token
          - git clone https://$GIT_TOKEN@github.com/vicoftech/prefect_etl.git .
          - cd /app
          # Instalar dependencias
          - pip install --no-cache-dir -r requirements.txt
    parameters:
      input_file: "input.csv"
